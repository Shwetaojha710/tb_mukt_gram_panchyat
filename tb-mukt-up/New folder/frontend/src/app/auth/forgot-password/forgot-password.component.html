<div class="auth-shell">
  <div class="auth-card" style="max-width: 520px">
    <div class="brand-header text-center mb-3">
      <app-brand-logo size="md" />
      <h1>Forgot Password</h1>
      <p class="subtitle">पासवर्ड रीसेट</p>
    </div>

    <div *ngIf="step === 'request'">
      <form [formGroup]="requestForm" (ngSubmit)="request()">
        <div class="mb-3">
          <label class="form-label">Mobile</label>
          <input class="form-control" formControlName="mobile" />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" formControlName="email" type="email" />
        </div>
        <button class="btn btn-primary w-100" [disabled]="loading">Send Reset Link</button>
      </form>
    </div>

    <div *ngIf="step === 'reset'">
      <form [formGroup]="resetForm" (ngSubmit)="reset()">
        <div class="mb-3">
          <label class="form-label">Reset Token</label>
          <input class="form-control" formControlName="token" />
        </div>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input class="form-control" type="password" formControlName="newPassword" />
        </div>
        <button class="btn btn-primary w-100" [disabled]="loading">Update Password</button>
      </form>
    </div>

    <div class="mt-3 text-center">
      <a routerLink="/login">Back to Login</a>
    </div>
  </div>
</div>
