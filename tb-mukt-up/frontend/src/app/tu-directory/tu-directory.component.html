<div class="page">
  <div class="page-head">
    <div>
      <h1>Year wise TBMP Data</h1>
      <p *ngIf="book as b">{{ b.label }}</p>
    </div>
  </div>

  <div class="toolbar panel">
    <div class="year-chips" role="group" aria-label="Year">
      <button
        *ngFor="let b of books"
        type="button"
        class="year-chip"
        [class.active]="year === b.year"
        (click)="selectYear(b.year)"
      >
        {{ b.year }}
      </button>
    </div>

    <label class="view" *ngIf="(book?.sheets?.length || 0) > 1">
      <span>View</span>
      <select [ngModel]="sheetIndex" (ngModelChange)="selectSheet($event)">
        <option *ngFor="let s of book?.sheets; let i = index" [ngValue]="i">{{ sheetLabel(s.name) }}</option>
      </select>
    </label>

    <label class="search">
      <span class="sr-only">Search</span>
      <input type="search" [(ngModel)]="query" placeholder="Search district…" />
    </label>
    <span class="count" *ngIf="sheet">{{ rows.length }} districts</span>
  </div>

  <section class="panel table-panel" *ngIf="sheet as s">
    <header>
      <h2>{{ s.title || sheetLabel(s.name) }}</h2>
    </header>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th
              *ngFor="let i of columns"
              [class.num]="!isTextHeader(s.headers[i])"
              [class.sticky]="i < 2"
              [class.sticky-2]="i === 1"
              [title]="s.headers[i]"
            >
              {{ headerLabel(s.headers[i]) }}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of rows" [class.total]="isTotal(row)">
            <td
              *ngFor="let i of columns"
              [class.num]="isNum(row[i])"
              [class.sticky]="i < 2"
              [class.sticky-2]="i === 1"
            >
              {{ cellText(row[i], s.headers[i] || '') }}
            </td>
          </tr>
          <tr *ngIf="!rows.length">
            <td [attr.colspan]="columns.length" class="empty">No district matches “{{ query }}”.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
