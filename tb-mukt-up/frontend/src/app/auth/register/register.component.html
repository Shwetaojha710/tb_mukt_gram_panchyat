<div class="auth-shell">
  <div class="auth-card">
    <div class="brand-header text-center mb-3">
      <img src="assets/logo.png" alt="TB Mukt" class="brand-logo" />
      <h1>User Registration</h1>
      <p class="subtitle">टीबी मुक्त उत्तर प्रदेश · पंजीकरण</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name *</label>
          <input class="form-control" formControlName="fullName" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Mobile Number *</label>
          <input class="form-control" formControlName="mobile" maxlength="10" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Email *</label>
          <input class="form-control" formControlName="email" type="email" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Username *</label>
          <input class="form-control" formControlName="username" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Password *</label>
          <div class="input-group">
            <input class="form-control" [type]="showPassword ? 'text' : 'password'" formControlName="password" />
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword">{{ showPassword ? 'Hide' : 'Show' }}</button>
          </div>
          <div class="form-text">Min 8 chars with upper, lower, number & special character</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password *</label>
          <input class="form-control" type="password" formControlName="confirmPassword" />
          <div class="text-danger small" *ngIf="form.hasError('mismatch') && form.touched">Passwords do not match</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Designation</label>
          <input class="form-control" formControlName="designation" />
        </div>
      </div>

      <hr class="my-4" />
      <h2 class="section-title">Location Mapping</h2>
      <app-location-cascade [value]="location" (valueChange)="onLocationChange($event)"></app-location-cascade>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <a routerLink="/login">Back to Login</a>
        <button class="btn btn-primary px-4" type="submit" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          Register
        </button>
      </div>
    </form>
  </div>
</div>
