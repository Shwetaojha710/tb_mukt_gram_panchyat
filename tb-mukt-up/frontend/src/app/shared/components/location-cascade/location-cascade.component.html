<div class="row g-3 location-cascade">
  <div class="col-md-6">
    <label class="form-label">District / जनपद <span class="text-danger">*</span></label>
    <select
      class="form-select"
      [(ngModel)]="value.districtId"
      (ngModelChange)="onDistrictChange()"
      [disabled]="disabled || lockDistrict || loading"
      name="districtId"
      required
    >
      <option [ngValue]="null">{{ loading ? 'Loading...' : 'Select District' }}</option>
      <option *ngFor="let s of districts" [ngValue]="s.id">{{ s.name }}</option>
    </select>
  </div>

  <div class="col-md-6">
    <label class="form-label">Block / ब्लॉक <span class="text-danger">*</span></label>
    <select
      class="form-select"
      [(ngModel)]="value.blockId"
      (ngModelChange)="onBlockChange()"
      [disabled]="disabled || lockBlock || !value.districtId"
      name="blockId"
      required
    >
      <option [ngValue]="null">Select Block</option>
      <option *ngFor="let s of blocks" [ngValue]="s.id">{{ s.name }}</option>
    </select>
  </div>

  <div class="col-md-6">
    <label class="form-label">Gram Panchayat / ग्राम पंचायत <span class="text-danger">*</span></label>
    <select
      class="form-select"
      [(ngModel)]="value.gpId"
      (ngModelChange)="onGpChange()"
      [disabled]="disabled || lockGp || !value.blockId"
      name="gpId"
      required
    >
      <option [ngValue]="null">Select Gram Panchayat</option>
      <option *ngFor="let s of gps" [ngValue]="s.id">{{ s.name }}</option>
    </select>
  </div>

  <div class="col-md-6" *ngIf="showVillage">
    <label class="form-label">Village / ग्राम</label>
    <select
      class="form-select"
      [(ngModel)]="value.villageId"
      (ngModelChange)="onVillageChange()"
      [disabled]="disabled || lockVillage || !value.gpId"
      name="villageId"
    >
      <option [ngValue]="null">Select Village</option>
      <option *ngFor="let s of villages" [ngValue]="s.id">{{ s.name }}</option>
    </select>
  </div>
</div>
