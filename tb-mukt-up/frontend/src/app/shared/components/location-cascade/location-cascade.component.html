<div
  class="row location-cascade"
  [class.g-2]="!compact"
  [class.compact]="compact"
>
  <div [class]="compact ? 'col' : 'col-md-6'" *ngIf="!hideDistrict">
    <label class="form-label">
      District
      <span class="text-danger" *ngIf="showRequiredMark">*</span>
    </label>
    <select
      class="form-select"
      [class.form-select-sm]="compact"
      [ngModel]="idStr(value.districtId)"
      (ngModelChange)="onDistrictIdChange($event)"
      [disabled]="disabled || lockDistrict || loading"
      name="districtId"
      required
    >
      <option value="">{{ loading ? 'Loading...' : 'Select District' }}</option>
      <option *ngFor="let s of districts" [value]="s.id">{{ s.name }}</option>
    </select>
  </div>

  <div [class]="compact ? 'col' : 'col-md-6'" *ngIf="!hideBlock">
    <label class="form-label">
      Block
      <span class="text-danger" *ngIf="showRequiredMark">*</span>
    </label>
    <select
      class="form-select"
      [class.form-select-sm]="compact"
      [ngModel]="idStr(value.blockId)"
      (ngModelChange)="onBlockIdChange($event)"
      [disabled]="disabled || lockBlock || (!hideDistrict && !value.districtId)"
      name="blockId"
      required
    >
      <option value="">Select Block</option>
      <option *ngFor="let s of blocks" [value]="s.id">{{ s.name }}</option>
    </select>
  </div>

  <div [class]="compact ? 'col' : (hideDistrict && hideBlock ? 'col-md-12' : 'col-md-6')">
    <label class="form-label">
      GP
      <span class="text-danger" *ngIf="showRequiredMark">*</span>
    </label>
    <select
      class="form-select"
      [class.form-select-sm]="compact"
      [ngModel]="idStr(value.gpId)"
      (ngModelChange)="onGpIdChange($event)"
      [disabled]="disabled || lockGp || (!value.blockId && !hideBlock)"
      name="gpId"
      required
    >
      <option value="">Select GP</option>
      <option *ngFor="let s of gps" [value]="s.id">{{ s.name }}</option>
    </select>
  </div>

  <div [class]="compact ? 'col' : 'col-md-6'" *ngIf="showVillage">
    <label class="form-label">
      Village
      <span class="text-danger" *ngIf="showRequiredMark">*</span>
    </label>
    <select
      class="form-select"
      [class.form-select-sm]="compact"
      [ngModel]="idStr(value.villageId)"
      (ngModelChange)="onVillageIdChange($event)"
      [disabled]="disabled || lockVillage || !value.gpId"
      name="villageId"
      required
    >
      <option value="">Select Village</option>
      <option *ngFor="let s of villages" [value]="s.id">{{ s.name }}</option>
    </select>
  </div>
</div>
